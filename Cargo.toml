[workspace]
resolver = "2"
members = [
    "crates/orkai-core",
    "crates/orkai-storage",
    "crates/orkai-pty",
    "crates/orkai-mcp",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/orkai/orkai"
rust-version = "1.77"

[workspace.dependencies]
orkai-core = { path = "crates/orkai-core" }
orkai-storage = { path = "crates/orkai-storage" }
orkai-pty = { path = "crates/orkai-pty" }
orkai-mcp = { path = "crates/orkai-mcp" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
strip = true
