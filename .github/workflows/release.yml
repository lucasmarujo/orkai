name: Release

# Dispara quando o app muda em main. Mudancas so na landing page, docs ou plans
# nao geram release.
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Le a versao do tauri.conf.json e so segue se ela ainda nao foi lancada.
  # Assim voce controla a cadencia pelo bump de versao, sem taggear na mao.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version ja foi lancada. Bumpe a versao para gerar uma release nova."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Versao nova detectada: v$version"
          fi

  windows:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # O target-dir do .cargo/config.toml existe so na maquina local (OneDrive).
      - run: Remove-Item .cargo/config.toml -Force
        shell: pwsh
      - run: npx tauri build
        working-directory: apps/desktop
      # O Tauri embute a versao no nome do arquivo. Renomear para um nome fixo mantem
      # estavel o link /releases/latest/download/ que a landing page usa.
      - name: Renomear instaladores para nome sem versao
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/msi/*.msi | Rename-Item -NewName 'Orkai_x64_en-US.msi'
          Get-ChildItem target/release/bundle/nsis/*.exe | Rename-Item -NewName 'Orkai_x64-setup.exe'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: |
            target/release/bundle/msi/Orkai_x64_en-US.msi
            target/release/bundle/nsis/Orkai_x64-setup.exe
