name: Release

# Dispara quando o app muda em main. Mudancas so na landing page, docs ou plans
# nao geram release.
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Le a versao do tauri.conf.json e so segue se ela ainda nao foi lancada.
  # Assim voce controla a cadencia pelo bump de versao, sem taggear na mao.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version ja foi lancada. Bumpe a versao para gerar uma release nova."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Versao nova detectada: v$version"
          fi

  windows:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # O target-dir do .cargo/config.toml existe so na maquina local (OneDrive).
      - run: Remove-Item .cargo/config.toml -Force
        shell: pwsh
      # A chave assina os artefatos do updater. Sem ela o build sai sem os .sig e o app
      # instalado recusa a atualizacao (o pubkey do tauri.conf.json nao bate com nada).
      # A secret de senha nao existe de proposito: a chave foi gerada sem senha, e o
      # GitHub nao aceita secret vazia. Secret inexistente virá como string vazia — que e
      # o que o CLI espera. Nao remova a linha: variavel ausente faz o CLI abrir um prompt
      # interativo e pendurar o job.
      - run: npx tauri build
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # O Tauri embute a versao no nome do arquivo. Renomear para um nome fixo mantem
      # estavel o link /releases/latest/download/ que a landing page usa.
      - name: Renomear instaladores para nome sem versao
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/msi/*.msi | Rename-Item -NewName 'Orkai_x64_en-US.msi'
          Get-ChildItem target/release/bundle/nsis/*.exe | Rename-Item -NewName 'Orkai_x64-setup.exe'
      # Manifesto que o plugin updater le para descobrir se ha versao nova. Aponta para o
      # mesmo link fixo do botao da landing page: a assinatura cobre o conteudo do .msi,
      # entao renomear o instalador acima nao a invalida.
      - name: Gerar latest.json do updater
        shell: pwsh
        run: |
          $sig = (Get-ChildItem target/release/bundle/msi/*.msi.sig | Select-Object -First 1 | Get-Content -Raw).Trim()
          if (-not $sig) { throw 'assinatura do updater ausente — a secret TAURI_SIGNING_PRIVATE_KEY esta configurada?' }
          @{
            version   = '${{ needs.check.outputs.version }}'
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = $sig
                url       = 'https://github.com/${{ github.repository }}/releases/latest/download/Orkai_x64_en-US.msi'
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8NoBOM

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: |
            target/release/bundle/msi/Orkai_x64_en-US.msi
            target/release/bundle/nsis/Orkai_x64-setup.exe
            latest.json
