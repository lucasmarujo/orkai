name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # O target-dir do .cargo/config.toml existe so na maquina local (OneDrive).
      - run: Remove-Item .cargo/config.toml -Force
        shell: pwsh
      - run: npx tauri build
        working-directory: apps/desktop
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
